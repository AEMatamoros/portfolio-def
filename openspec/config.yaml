# openspec/config.yaml -- SDD project config for portfolio-def
# Generated by sdd-init on 2026-10-14. Artifact store: openspec.
schema: spec-driven

context: |
  Tech stack: Vite 6 + React 18.3 (SWC) + TypeScript ~5.7 (strict), Tailwind CSS v4 (@tailwindcss/vite), shadcn/ui (radix-nova), pnpm only.
  Libraries: i18next/react-i18next (EN/ES), GSAP + @react-spring/web animations, react-hook-form, axios, notiflix, lucide-react.
  Architecture: single-page portfolio SPA; flat feature folders under src (components, components/ui, components/animations, hooks, constants, i18n, utils, lib).
  Imports: path aliases only (@/, @Components, @Hooks, @Constants, @Utils, @Assets); relative ./ and ../ imports are banned by ESLint.
  Testing: no test runner configured; quality gate is `pnpm check` (tsc -b + eslint + prettier --check).
  Style: Prettier (double quotes, semicolons, trailing commas, width 80); Conventional Commits via commitlint; Husky + lint-staged.

# Strict TDD fails closed to false: no test runner and no workspace-level test command exist.
strict_tdd: false

projects:
  - path: "."
    stack: "TypeScript / React 18 / Vite 6 / Tailwind v4 / pnpm"
    package_manager: pnpm
    test_command: ""
    test_framework: ""
    coverage_command: ""
    linter: "pnpm lint"
    type_checker: "pnpm typecheck"
    formatter: "pnpm format:check"
    build_command: "pnpm build"
    quality_gate: "pnpm check"

testing:
  detected: "2026-10-14"
  strict_tdd: false
  workspace_test_command: ""
  runner:
    available: false
    tool: ""
    command: ""
  layers:
    unit: { available: false, tool: "" }
    integration: { available: false, tool: "" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: true, tool: "ESLint 9 flat config (typescript-eslint, react, react-hooks, react-refresh, import)", command: "pnpm lint" }
    type_checker: { available: true, tool: "TypeScript ~5.7 (tsc -b)", command: "pnpm typecheck" }
    formatter: { available: true, tool: "Prettier 3", command: "pnpm format:check" }
    combined: { available: true, command: "pnpm check" }
  notes:
    - "No vitest/jest/playwright/cypress or testing-library installed; do not assume a runner."
    - "Verification relies on pnpm check and pnpm build; UI behavior is verified manually via pnpm dev."

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - State impact on both languages (EN and ES) when user-facing copy changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Scenarios MUST be verifiable without a test runner (via pnpm check, pnpm build, or manual browser steps) until one is added.
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale.
    - Use shadcn/ui primitives from src/components/ui with cn() from @/lib/utils; do not replace them with ad-hoc styled elements.
    - Keep existing animation modules (SplitText, ShinyText, GSAP hooks); never remove animation behavior silently.
    - Use path aliases only; relative ./ and ../ imports violate the ESLint no-restricted-imports rule.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Include a final task that runs pnpm check.
  apply:
    guidelines:
      - Follow existing code patterns and the portfolio skill (.cursor/skills/portfolio/SKILL.md).
      - Use pnpm only; never npm or yarn, and never add package-lock.json.
      - Add user-facing strings to both src/i18n/EN.ts and src/i18n/ES.ts.
      - Commit messages MUST follow Conventional Commits (commitlint enforces them).
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "pnpm build"
    typecheck_command: "pnpm typecheck"
    lint_command: "pnpm lint"
    format_command: "pnpm format:check"
    quality_gate_command: "pnpm check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
