# openspec/config.yaml -- SDD project config for portfolio-def
# Generated by sdd-init on 2026-10-14. Artifact store: openspec.
schema: spec-driven

context: |
  Tech stack: Vite 6 + React 19 (SWC) + TypeScript ~5.7 (strict), Tailwind CSS v4 (@tailwindcss/vite), shadcn/ui (radix-nova), pnpm only (Node 22 via .nvmrc, pinned by packageManager).
  Libraries: i18next 26 / react-i18next 17 (EN/ES), GSAP (lazy per-section scroll reveal), react-hook-form, sonner toasts, fetch for the contact request, lucide-react.
  Architecture: single-page portfolio SPA, feature-first. src/{app,config,theme,i18n,types,lib,hooks,components,features}; components/{ui,animations,atoms,molecules,layout}; features/{hero,experience,techs,projects,contact} each with their own data/, assets and presentational components/.
  Imports: the single alias @/ (to src/); relative ./ and ../ imports are banned by ESLint. Five import tiers are lint-enforced: lib+types, then config+i18n+theme+hooks, then components, then features, then app. Shared code never imports features, and a feature never imports a sibling feature.
  i18n: typed nested keys in src/i18n/locales/en.ts and es.ts (identical shape, checked by tsc); read the language with useLocale(), never by comparing i18n.language.
  Configuration: VITE_CONTACT_API_URL is a public, optional build-time variable (see .env.example); when unset the contact section renders a mailto fallback.
  Testing: no test runner configured; quality gate is `pnpm check` (tsc -b + eslint + prettier --check), and CI (.github/workflows/ci.yml) runs it with `pnpm build`.
  Style: Prettier (double quotes, semicolons, trailing commas, width 80); Conventional Commits via commitlint; Husky + lint-staged.

# Strict TDD fails closed to false: no test runner and no workspace-level test command exist.
strict_tdd: false

projects:
  - path: "."
    stack: "TypeScript / React 19 / Vite 6 / Tailwind v4 / feature-first / pnpm"
    package_manager: pnpm
    test_command: ""
    test_framework: ""
    coverage_command: ""
    linter: "pnpm lint"
    type_checker: "pnpm typecheck"
    formatter: "pnpm format:check"
    build_command: "pnpm build"
    quality_gate: "pnpm check"

testing:
  detected: "2026-10-14"
  strict_tdd: false
  workspace_test_command: ""
  runner:
    available: false
    tool: ""
    command: ""
  layers:
    unit: { available: false, tool: "" }
    integration: { available: false, tool: "" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: true, tool: "ESLint 9 flat config (typescript-eslint, react, react-hooks, react-refresh, jsx-a11y; import boundaries via no-restricted-imports)", command: "pnpm lint" }
    type_checker: { available: true, tool: "TypeScript ~5.7 (tsc -b)", command: "pnpm typecheck" }
    formatter: { available: true, tool: "Prettier 3", command: "pnpm format:check" }
    combined: { available: true, command: "pnpm check" }
  notes:
    - "No vitest/jest/playwright/cypress or testing-library installed; do not assume a runner."
    - "Verification relies on pnpm check and pnpm build; UI behavior is verified manually via pnpm dev."

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - State impact on both languages (EN and ES) when user-facing copy changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Scenarios MUST be verifiable without a test runner (via pnpm check, pnpm build, or manual browser steps) until one is added.
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale.
    - Use shadcn/ui primitives from src/components/ui with cn() from @/lib/utils; do not replace them with ad-hoc styled elements.
    - Keep existing animation modules (SplitText, ShinyText, the GSAP useReveal hook) and honor prefers-reduced-motion; never remove animation behavior silently.
    - Use the single @/ alias only; relative ./ and ../ imports violate the ESLint no-restricted-imports rule.
    - Respect the lint-enforced import tiers (lib+types, config+i18n+theme+hooks, components, features, app); promote code to the shared kit only when two or more features use it.
    - Presentational components under features/*/components take props only; data access, i18n and view models live in the section container.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Include a final task that runs pnpm check.
  apply:
    guidelines:
      - Follow existing code patterns and the portfolio skill (.cursor/skills/portfolio/SKILL.md).
      - Use pnpm only; never npm or yarn, and never add package-lock.json.
      - Add user-facing strings to both src/i18n/locales/en.ts and src/i18n/locales/es.ts (same nested shape; never change existing Spanish copy).
      - Read the language with useLocale(), not by comparing i18n.language.
      - Convert images to WebP with `pnpm dlx sharp-cli@5 resize <w> <h> --fit cover --position top --withoutEnlargement -i <in> -o <out>.webp -f webp --quality 80`; do not commit PNG or JPG originals.
      - Commit messages MUST follow Conventional Commits (commitlint enforces them).
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "pnpm build"
    typecheck_command: "pnpm typecheck"
    lint_command: "pnpm lint"
    format_command: "pnpm format:check"
    quality_gate_command: "pnpm check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
